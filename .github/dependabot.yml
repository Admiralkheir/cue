version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # gpui-kit pins an exact gpui-pre snapshot; these move together by hand.
      - dependency-name: gpui-pre-platform
