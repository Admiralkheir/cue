[package]
name = "cue-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "cue"
path = "src/main.rs"

[dependencies]
cue-core.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
futures.workspace = true
global-hotkey.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
# Decodes the menu bar icon.
image = { workspace = true, features = ["png"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

# Build scripts run on the host, so this matches native Windows builds (what CI does).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }
