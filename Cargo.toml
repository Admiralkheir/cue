[workspace]
resolver = "3"
members = ["crates/cue-core", "crates/cue-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Admiralkheir/cue"
authors = ["Tugay Ersoy"]
# Shipped as an app, not as crates on crates.io.
publish = false

[workspace.dependencies]
cue-core = { path = "crates/cue-core" }

# gpui-kit re-exports gpui (the gpui-pre weekly Zed snapshot) plus gpui-component.
# gpui_platform must stay on the exact gpui-pre version gpui-kit pins.
gpui-kit = "0.8.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }

raw-window-handle = { version = "0.6", features = ["std"] }
# Native window tweaks GPUI doesn't expose; versions match what gpui-pre already pulls in.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

global-hotkey = "0.10"
# The notification-area (Windows) and menu bar (macOS) icon. Without the default
# libappindicator feature, so Linux builds need no extra GTK packages.
tray-icon = { version = "0.26", default-features = false }
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
futures = "0.3"
ureq = "3.4"
keyring = "4.2"
base64 = "0.23"
serde_json = "1"
# Self-update: comparing release versions and checking downloads against SHA256SUMS.txt.
semver = "1"
sha2 = "0.10"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
tempfile = "3"
