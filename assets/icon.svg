<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cue app icon: a chat bubble shaped like a "C" with an AI hint spark inside.
       Master artwork; the PNG, ICO and ICNS files in this folder are rendered from it
       by scripts/render-icons. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f2e"/>
      <stop offset="0.5" stop-color="#1b2166"/>
      <stop offset="1" stop-color="#4a3bb0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>

  <!-- The bubble: an open ring (the C) plus a tail at the bottom left. -->
  <g fill="#e8eaed" stroke="#e8eaed" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 697.8 632 A 240 240 0 1 1 697.8 392" fill="none" stroke-width="84"/>
    <path d="M 292 670 L 384 766 L 256 802 Z" stroke-width="28"/>
  </g>

  <!-- The spark. -->
  <path transform="translate(514 512)" fill="#8ab4f8" stroke="#8ab4f8" stroke-width="14" stroke-linejoin="round"
        d="M 0 -112 Q 20 -20 112 0 Q 20 20 0 112 Q -20 20 -112 0 Q -20 -20 0 -112 Z"/>
</svg>
