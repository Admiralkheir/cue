# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
# The platforms Cue ships on.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
# Vulnerabilities always fail. "Unmaintained" notices only fail for crates Cue depends on
# directly; as of October 2026 GPUI and gpui-kit pull in instant, paste, rustybuzz and
# ttf-parser, which have no maintained upgrade yet.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
# Everything here is compatible with shipping Cue under MIT. MPL-2.0 covers option-ext
# (through `directories`) and cbindgen (build time only); neither is modified.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# GPUI and its platform crates pull in several versions of windows-rs and objc2.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
